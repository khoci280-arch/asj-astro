# ─── Build Configuration ───
[build]
  command = "npm run build"
  publish = "dist"

# ─── Cache Headers ───
# HTML files: NEVER cache (always fetch fresh from server)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

# Root index.html
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

# Service Worker: NEVER cache (must always check for updates)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

# Static assets (hashed by Vite): cache forever (immutable)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Manifest: short cache (check for updates daily)
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ─── SPA-style redirects (optional, for client-side routing) ───
# Uncomment if you add client-side routing later:
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200
