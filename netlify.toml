# ─── Netlify Configuration ───
# Astro static site + legacy Netlify Functions backend
# Site: https://incredible-starship-054a78.netlify.app

[build]
  command = "npm run build"
  publish = "dist"

# Backend functions — point to the working legacy directory
[functions]
  directory = "legacy/netlify/functions"
  node_bundler = "esbuild"
  included_files = [
    "legacy/netlify/functions/_lib/**",
    "shared/**"
  ]

# Cache headers for static assets
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# SPA fallback for client-side routes
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/candidate"
  to = "/index.html"
  status = 200
