# ─── Netlify Configuration ───
# Astro static site + Netlify Functions backend

[build]
  command = "npm run build"
  publish = "dist"

# Backend functions
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = [
    "netlify/functions/_lib/**",
    "netlify/functions/shared/**"
  ]

# Cache headers
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/candidate"
  to = "/index.html"
  status = 200


# ─── Old endpoint aliases (strangler-fig migration) ───
# Keep old endpoint names working via redirects. Delete after 30 days of zero traffic.
[[redirects]]
  from = "/.netlify/functions/get-app-data"
  to = "/.netlify/functions/handlers"
  status = 200

